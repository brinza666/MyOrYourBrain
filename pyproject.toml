[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-or-your-brain"
version = "0.1.0"
description = "Provider-neutral, Git-backed second brain with bounded council review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "brinza" }]
dependencies = []

[project.scripts]
brain = "myoryourbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
